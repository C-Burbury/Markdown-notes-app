# fly.toml app configuration file generated for markdown-notes on 2026-10-01T15:37:39-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'markdown-notes'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  cpus = 1
  memory_mb = 512

[env]
  ACCESS_TOKEN_EXPIRE_MINUTES = '30'
  CORS_ORIGINS = '["https://markdown-notes-app-swart.vercel.app"]'